    <rect x="-45" y="-150" width="90" height="300" rx="45" fill="url(#p)" />
    <rect x="-150" y="-45" width="300" height="90" rx="45" fill="url(#p)" />
    
    <!-- Perfectly Aligned Symmetrical Heart -->
    <path d="M0,48 C-35,48 -58,22 -58,-12 C-58,-40 -35,-60 0,-20 C35,-60 58,-40 58,-12 C58,22 35,48 0,48 Z" 
